// ---------------------------------------------------------------------------
// Build redistribuable Windows : app-image jpackage (JRE embarqué + assets).
//   gradle -p java packageApp
// Produit build/jpackage/AlienBreed3D2-TKG/ (dossier portable, AlienBreed3D2-TKG.exe).
// Nécessite jpackage (inclus dans le JDK qui exécute Gradle).
// ---------------------------------------------------------------------------
def appImageName = application.applicationName
def appImageDest = layout.buildDirectory.dir('jpackage').get().asFile
def appImageDir  = new File(appImageDest, appImageName)

// Étape 1 : jpackage crée l'app-image (exécutable + JRE embarqué).
tasks.register('jpackageImage', Exec) {
    group = 'distribution'
    description = "Crée l'app-image jpackage (sans les assets)."
    dependsOn 'installDist'
    def libDir   = layout.buildDirectory.dir("install/${appImageName}/lib").get().asFile
    def jpackage = "${System.getProperty('java.home')}/bin/jpackage"
    doFirst {
        // jpackage refuse d'écrire si l'image existe déjà → on repart propre.
        appImageDir.deleteDir()
        appImageDest.mkdirs()
    }
    commandLine jpackage,
        '--type', 'app-image',
        '--name', appImageName,
        '--input', libDir.absolutePath,
        '--main-jar', "${base.archivesName.get()}.jar",
        '--main-class', application.mainClass.get(),
        '--dest', appImageDest.absolutePath,
        '--java-options', '-Xms256m',
        '--java-options', '-Xmx1g',
        '--java-options', '-XX:+HeapDumpOnOutOfMemoryError'
}

// Étape 2 : copie les assets + dossier d'écriture à côté de l'exe (résolus par Main).
//   gradle -p java packageApp  →  build/jpackage/AlienBreed3D2-TKG/ (dossier portable).
tasks.register('packageApp', Copy) {
    group = 'distribution'
    description = 'Build redistribuable Windows complet (app-image jpackage + assets embarqués).'
    dependsOn 'jpackageImage'
    def srcMedias = new File(assetRoot, 'medias/original')
    doFirst {
        if (!srcMedias.isDirectory()) {
            throw new GradleException("Assets introuvables : ${srcMedias} (requis pour le build embarqué)")
        }
    }
    from srcMedias
    into new File(appImageDir, 'medias/original')
    doLast {
        new File(appImageDir, 'run').mkdirs()   // dossier d'écriture (prefs, sauvegardes)
        println "App-image redistribuable : ${appImageDir.absolutePath}"
    }
}

// ===========================================================================
//  REBIRTH — l'autre MOTEUR du portage (paquet ab3d2.rebirth)
//
//  Le portage fidele (ab3d2.*) reste l'ORACLE : c'est lui qui lit les formats
//  d'origine et c'est contre lui qu'on valide. rebirth n'en est qu'un rendu
//  different, full 3D sur jMonkeyEngine, exactement comme host/ est le rendu
//  d'origine. Les deux vivent dans le meme arbre source et le meme build.
//
//    gradle -p java run                      # le portage fidele (moteur d'origine)
//    gradle -p java rebirth                  # le remake jME
//    gradle -p java extract                  # (re)fabrique les assets modernes
//    gradle -p java moveTest shotTest alienTest
// ===========================================================================

// Les assets MODERNES (PNG/JSON/OBJ) produits par `extract`. Hors depot, comme les
// originaux : ils se regenerent depuis les fichiers d'origine.
def rebirthAssets = new File(projectDir.parentFile, 'assets')

// Les options -P<nom> du remake deviennent -Drebirth.<nom>. Un drapeau nu (-Pfoo)
// vaut '1' ; sinon on transmet la valeur telle quelle.
def rebirthFlags = { JavaExec t, List<String> names ->
    names.each { n ->
        if (project.hasProperty(n)) {
            def v = project.property(n).toString()
            t.systemProperty("rebirth.$n", v.isEmpty() ? '1' : v)
        }
    }
}

tasks.register('extract', JavaExec) {
    group = 'rebirth'
    description = "Extrait les assets d'origine en formats modernes (PNG/JSON/OBJ)"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ab3d2.rebirth.extract.Extract'
    workingDir = assetRoot                 // pour qu'Assets.root resolve medias/original
    systemProperty 'rebirth.assets', rebirthAssets.absolutePath
    if (project.hasProperty('what')) {
        args(project.property('what').toString())
    }
    rebirthFlags(it, ['sprPal'])
}

tasks.register('rebirth', JavaExec) {
    group = 'rebirth'
    description = 'Lance le remake full 3D (jMonkeyEngine)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ab3d2.rebirth.Main'
    workingDir = projectDir
    systemProperty 'rebirth.assets', rebirthAssets.absolutePath
    rebirthFlags(it, [
        'level', 'shot', 'freecam', 'at', 'noAction', 'health', 'sfxLog', 'nosound',
        'stats', 'weaponLog', 'shimmer', 'deformLog', 'dynLog', 'shotLog', 'fire',
        'gun', 'demo', 'spawn', 'autoplay', 'weaponInScene', 'story', 'startmenu',
        'map', 'mapAll', 'angle', 'pitch', 'lightLog', 'lightBatch', 'noshadow',
        'ssao', 'retro', 'fullbright', 'vsign',
    ])
}

// --- validations headless de la simulation (doivent afficher PASS) ---
['moveTest': 'ab3d2.rebirth.sim.MoveTest',
 'shotTest': 'ab3d2.rebirth.sim.ShotTest',
 'alienTest': 'ab3d2.rebirth.sim.AlienTest'].each { name, cls ->
    tasks.register(name, JavaExec) {
        group = 'verification'
        description = "Teste la simulation du remake sans fenetre ($name)"
        classpath = sourceSets.main.runtimeClasspath
        mainClass = cls
        workingDir = projectDir
        systemProperty 'rebirth.assets', rebirthAssets.absolutePath
        rebirthFlags(it, ['level', 'spawn', 'aiTrace', 'alienLog'])
    }
}

tasks.register('lightTest', JavaExec) {
    group = 'verification'
