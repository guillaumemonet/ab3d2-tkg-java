    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ab3d2.rebirth.LightTest'
    workingDir = projectDir
    systemProperty 'rebirth.assets', rebirthAssets.absolutePath
    rebirthFlags(it, ['anim', 'spr', 'ring', 'level'])
}

// Le portage a deja un menuTest (son propre menu) : celui-ci est le menu du remake.
tasks.register('rebirthMenuTest', JavaExec) {
    group = 'verification'
    description = "Affiche l'ecran du menu du remake (fond defilant, feu, texte)"
