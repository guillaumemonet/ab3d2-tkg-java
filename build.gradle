plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

ext {
    // LWJGL 3 « moderne » (GLFW + OpenGL + OpenAL).
    lwjglVersion = '3.3.4'
    // Natives Windows x64 (poste de dev). Ajouter d'autres classifiers si besoin.
    lwjglNatives = 'natives-windows'
    // jMonkeyEngine : le MOTEUR du remake (paquet ab3d2.rebirth), stable validee JDK 21.
    jmeVersion = '3.9.0-stable'
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-glfw'
    implementation 'org.lwjgl:lwjgl-opengl'
    implementation 'org.lwjgl:lwjgl-openal'

    runtimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-openal::$lwjglNatives"

    // --- moteur du remake (ab3d2.rebirth) ---
    // jME 3 + backend LWJGL3 (apporte transitivement glfw/opengl/openal + natives).
    implementation "org.jmonkeyengine:jme3-core:$jmeVersion"
    implementation "org.jmonkeyengine:jme3-desktop:$jmeVersion"
    implementation "org.jmonkeyengine:jme3-lwjgl3:$jmeVersion"
    // Effets du moteur : BloomFilter, SSAO, eau... (fournit aussi Common/MatDefs/Post).
    implementation "org.jmonkeyengine:jme3-effects:$jmeVersion"

    // JSON moderne : assets extraits (niveaux, base GLF) et reglages du remake.
    implementation 'com.google.code.gson:gson:2.11.0'
}

// Le portage conserve la disposition src/ NetBeans existante (pas src/main/java).
sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        // Les assets dépackés sont lus directement depuis medias/original via DosLib.
        // Seuls les SHADERS du remake passent par l'AssetManager de jME : eux doivent
        // etre sur le classpath.
        resources {
            srcDirs = ['resources']
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

base {
    // Nom du jar principal (utilisé par --main-jar de jpackage).
    archivesName = 'ab3d2-tkg'
}

application {
    // Point d'entrée réel du moteur (main.c → MainC.run via ab3d2.host.Main).
    mainClass = 'ab3d2.host.Main'
    // Nom de l'app-image redistribuable (dossier + exécutable).
    applicationName = 'AlienBreed3D2-TKG'
}

// Les assets d'origine ne font plus partie du depot : ils vivent a la racine de l'espace
// de travail, a cote de adf/. On les cherche en REMONTANT, et on execute depuis le dossier
// qui les contient pour que Assets.root (du portage) les resolve.
def findAssetRoot = {
    def d = projectDir
    for (int i = 0; i < 5 && d != null; i++, d = d.parentFile) {
        if (new File(d, 'medias/original').isDirectory()) {
            return d
        }
    }
    return projectDir.parentFile
}
def assetRoot = findAssetRoot()

tasks.named('run') {
    workingDir = assetRoot
    // Lien 2 joueurs (menu « 1 PLAYER ») : hôte/port du pair. Le slave se connecte à -PnetHost.
    if (project.hasProperty('netHost')) {
        systemProperty 'ab3d2.netHost', project.property('netHost').toString()
    }
    if (project.hasProperty('netPort')) {
        systemProperty 'ab3d2.netPort', project.property('netPort').toString()
    }
    if (project.hasProperty('coop')) {              // -Pcoop = défaut CO-OP dans le menu master (togglable)
        systemProperty 'ab3d2.coop', 'true'
    }
}

// Vérification de la disposition mémoire (garde-fou de non-régression du portage).
// Doit afficher « TOUT OK ».
tasks.register('checkLayout', JavaExec) {
    group = 'verification'
    description = 'Vérifie la disposition mémoire du portage (doit afficher TOUT OK)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ab3d2.tools.CheckLayout'
    workingDir = assetRoot
}

// Harnais de LANCEMENT 2 joueurs (lien TCP) — une instance master ou slave, interactif.
//   Terminal 1 : gradle -p java twoPlayer -PnetArgs="master 0"
//   Terminal 2 : gradle -p java twoPlayer -PnetArgs="slave 0 localhost"
// Lancer le master d'abord. -PnetPort=N pour changer de port (défaut 7979).
tasks.register('twoPlayer', JavaExec) {
    group = 'application'
    description = 'Lance une instance 2 joueurs (lien TCP). -PnetArgs="master|slave [niveau] [hôte]"'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ab3d2.host.TwoPlayerTest'
    workingDir = assetRoot
    if (project.hasProperty('netArgs')) {
        args(project.property('netArgs').toString().split(' '))
    }
    if (project.hasProperty('netPort')) {
        systemProperty 'netPort', project.property('netPort').toString()
    }
    if (project.hasProperty('netFrames')) {
        systemProperty 'net.frames', project.property('netFrames').toString()
    }
    if (project.hasProperty('coop')) {              // -Pcoop = mode CO-OP (ennemis) ; défaut = VERSUS
        systemProperty 'ab3d2.coop', 'true'
    }
    if (project.hasProperty('netWalk')) {           // -PnetWalk = test : avance en continu (aggro aliens)
        systemProperty 'net.walk', 'true'
    }
}

// Test « client/serveur local » du lien 2 joueurs (TCP) : lance master + slave (fork) sur
// localhost et vérifie l'échange lock-step de longs (SENDFIRST/RECFIRST). Doit afficher PASS.
tasks.register('netTest', JavaExec) {
    group = 'verification'
    description = 'Teste le lien 2 joueurs TCP en local (master + slave sur localhost) — doit afficher PASS'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ab3d2.tools.SerialLinkTest'
    workingDir = assetRoot
}

